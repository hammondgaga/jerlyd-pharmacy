<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jerlyd Pharmacy — Patient Care Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-pattern" aria-hidden="true"></div>
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✚</span>
        <div>
          <p class="brand-name">Jerlyd Pharmacy</p>
          <p class="brand-tag">Trusted care, clear guidance</p>
        </div>
      </div>
      <nav class="site-nav" id="siteNav">
        <button type="button" class="nav-btn" data-view="welcome">Home</button>
        <button type="button" class="nav-btn" data-view="patient">Patient portal</button>
        <button type="button" class="nav-btn nav-btn--accent" data-view="admin">
          Pharmacist
        </button>
      </nav>
    </header>

    <main id="appRoot" class="main"></main>

    <footer class="site-footer">
      <p>
        Jerlyd Pharmacy — For questions about your medications, speak with your pharmacist or
        prescriber. This portal does not replace professional medical advice.
      </p>
      <p class="footer-note" id="demoNote"></p>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
